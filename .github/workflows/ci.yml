name: Autergo CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Pytest & Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx reportlab

      - name: Run Pytest Test Suite
        env:
          ENV: test
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          GUEST_SECRET_KEY: test_secret_key_32_bytes_length_sha256_valid
          GROQ_API_KEY: mock_key
          DEEPGRAM_API_KEY: mock_key
          CARTESIA_API_KEY: mock_key
          RESEND_API_KEY: mock_key
        run: |
          pytest tests/ -v --cov=backend

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Modules
        run: npm ci

      - name: Build Production Frontend
        run: npm run build
